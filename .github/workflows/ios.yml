name: iOS Simulator Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read application version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Validate unsigned iPhone/iPad simulator build
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/finora-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned simulator application
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/finora-ios-derived/Build/Products/Debug-iphonesimulator/App.app" "$RUNNER_TEMP/FINORA-ios-simulator-v$VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FINORA-ios-simulator-v${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/FINORA-ios-simulator-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
