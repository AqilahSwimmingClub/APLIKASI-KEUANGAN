name: Publish A-Zuha Finance Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Resolve version
        id: version
        run: |
          test "$GITHUB_REF_NAME" = main
          VERSION=$(node -p 'require("./package.json").version')
          test -f "docs/releases/v$VERSION.md"
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'Signed release blocked: Android signing secrets are incomplete.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Build and verify signed release APK
        id: signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azuha-release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/azuha-release.jks"
          (cd android && ./gradlew --no-daemon --max-workers=2 assembleRelease)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/A-Zuha-Finance-v${{ steps.version.outputs.number }}-release.apk"
          echo "asset=artifacts/A-Zuha-Finance-v${{ steps.version.outputs.number }}-release.apk" >> "$GITHUB_OUTPUT"
      - name: Publish tag and APK
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_ASSET: ${{ steps.signed.outputs.asset }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "v$VERSION" "$SIGNED_ASSET" --target "$GITHUB_SHA" --title "A-Zuha Finance v$VERSION" --notes-file "docs/releases/v$VERSION.md"
