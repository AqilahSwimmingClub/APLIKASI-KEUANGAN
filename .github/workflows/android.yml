name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Read application version
        id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run android:sync
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew
      - run: ./gradlew --no-daemon --max-workers=2 assembleDebug
        working-directory: android
      - name: Enable KVM for emulator
        run: sudo chmod 666 /dev/kvm
      - name: Install and validate offline startup, orientation and hardware Back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            cd android && ./gradlew --no-daemon --max-workers=2 :app:connectedDebugAndroidTest
      - name: Save native test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-instrumentation-results
          path: |
            android/app/build/reports/androidTests/connected/
            android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Name debug APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/FINORA-android-v${{ steps.version.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: FINORA-android-v${{ steps.version.outputs.version }}-debug.apk
          path: artifacts/FINORA-android-v${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" && -n "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Release signing configured; signed APK will be built.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing skipped: one or more Android signing secrets are unavailable. Debug APK remains available; its ephemeral runner signature cannot be used for stable updates.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and verify signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finora-release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/finora-release.jks"
          (cd android && ./gradlew --no-daemon --max-workers=2 assembleRelease)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/FINORA-android-v${{ steps.version.outputs.version }}-release.apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: FINORA-android-v${{ steps.version.outputs.version }}-release.apk
          path: artifacts/FINORA-android-v${{ steps.version.outputs.version }}-release.apk
          if-no-files-found: error
